[project]
name = "mcprouter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp[apps]>=4.0.4",
    "huey>=3.4.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-aio>=2.1.7",
    "pytest-cov>=7.1.0",
    "pytest-reportlog>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
]
